<style>
/* Layout: phone-first app. A side drawer (permanent sidebar on wide screens) switches between five areas plus Chat;
   each area has pill sub-tabs and white cards. Sheets slide up for logging; full-screen overlays run sessions. */
:root {
  --bg: #ffffff;
  --bg2: #f7f8fa;
  --ink: #16181d;
  --muted: #858a94;
  --line: #e9ebef;
  --accent: #2d6cf0;
  --accent-soft: #eef3fe;
  --band: #e8effd;
  --on-accent: #ffffff;
  --bad: #e0483e;
  --bad-soft: #fdecea;
  --good: #1f9d63;
  --good-soft: #e5f6ee;
  --violet: #7a4ff0;
  --violet-soft: #efe9fe;
  --chip: #f2f3f5;
  --shadow: 0 1px 2px rgba(20, 24, 33, .04), 0 6px 20px rgba(20, 24, 33, .05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --drawer: min(78vw, 320px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1013; --bg2: #15181d; --ink: #eef0f3; --muted: #8d94a0; --line: #252a31; --accent: #6b9bff; --accent-soft: #18233a;
  --band: #16213a; --on-accent: #0b1020; --bad: #ff7a70; --bad-soft: #3a1c1a; --good: #4fd193; --good-soft: #16301f;
  --violet: #a98bff; --violet-soft: #251d3d; --chip: #1d2127; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1013; --bg2: #15181d; --ink: #eef0f3; --muted: #8d94a0; --line: #252a31; --accent: #6b9bff; --accent-soft: #18233a;
  --band: #16213a; --on-accent: #0b1020; --bad: #ff7a70; --bad-soft: #3a1c1a; --good: #4fd193; --good-soft: #16301f;
  --violet: #a98bff; --violet-soft: #251d3d; --chip: #1d2127; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; }

html, body { height: 100%; }

/* ---------- drawer ---------- */
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: var(--drawer); background: var(--bg2); display: flex; flex-direction: column;
  padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 6px; }
.logo { display: flex; align-items: center; gap: 12px; padding: 6px 8px 22px; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
.mark { width: 38px; height: 38px; flex: none; }
.senses { display: flex; align-items: center; gap: 12px; padding: 8px; color: var(--muted); font-size: 16px; text-align: left; border-radius: 14px; }
.senses:hover { background: var(--chip); }
.nav { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 16px; padding: 14px 14px; border-radius: 18px; color: var(--muted); font-size: 18px; text-align: left; }
.nav button svg { color: var(--muted); }
.nav button[aria-current="page"] { background: var(--chip); color: var(--accent); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .gap { height: 18px; }
.me { display: flex; align-items: center; gap: 12px; padding: 18px 10px 4px; font-size: 18px; font-weight: 500; text-align: left; }
.me .mark { width: 34px; height: 34px; }
.badge { background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }

/* ---------- main panel ---------- */
.shell { position: relative; z-index: 2; background: var(--bg); min-height: 100%; transition: transform .32s cubic-bezier(.3,.7,.2,1), border-radius .32s; }
body.open .shell { transform: translateX(var(--drawer)); border-radius: 36px 0 0 36px; box-shadow: -10px 0 40px rgba(10, 15, 25, .12); height: 100%; overflow: hidden; }

body.open .shield { display: block; left: var(--drawer); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: calc(14px + env(safe-area-inset-top, 0px)) 120px; }
header.bar { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; height: 64px; }

.round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); box-shadow: var(--shadow); display: grid; place-items: center; }

.sampleNote button { color: var(--accent); font-weight: 600; }

/* ---------- cards & type ---------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 28px; padding: 22px 20px; box-shadow: var(--shadow); min-width: 0; }
.cap { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

h3 { margin: 0; font-size: 18px; font-weight: 600; }
p { margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 26px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 16px; }
.btn.block { width: 100%; }

.btn.grey { background: var(--chip); color: var(--ink); }
.btn.text { background: none; color: var(--ink); padding: 0 16px; }
.btn.sm { height: 40px; padding: 0 18px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

/* noticed card */
.noticed { padding: 0; overflow: hidden; }
.noticed .band { background: var(--band); padding: 22px 30px 30px; }
.note { position: relative; background: var(--bg); border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; box-shadow: 0 8px 22px rgba(30, 60, 140, .1); }
.note::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -9px; height: 20px; background: var(--bg); opacity: .6; border-radius: 0 0 20px 20px; z-index: -1; }

.pill.bad { background: var(--bad-soft); color: var(--bad); }

.chart svg { width: 100%; height: auto; display: block; margin-top: 14px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 12px; margin-top: 18px; }
.facts b { display: block; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }

.weekbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 22px 0 10px; }
.weekbars i { height: 14px; border-radius: 999px; background: var(--chip); }

.pat p { font-size: 17px; }
.evid { color: var(--muted); font-size: 15px; font-weight: 500; }
.empty { text-align: center; padding: 70px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }

.empty h3 { font-size: 17px; }
.empty p { color: var(--muted); max-width: 34ch; }
.link { color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.rule { min-height: 160px; display: flex; flex-direction: column; gap: 6px; text-align: left; justify-content: space-between; }

.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }

.composer textarea { flex: 1; min-width: 0; resize: none; height: 50px; border-radius: 26px; border: 1px solid var(--line); background: var(--bg); padding: 13px 18px; box-shadow: var(--shadow); }

.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow: auto; background: var(--bg); border-radius: 30px 30px 0 0; display: flex; flex-direction: column; gap: 16px;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); animation: rise .28s ease-out; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }

</style>

  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

        { id: "j1", at: addDays(TODAY, -3) + "T08:10", text: "Rushed morning. Inbox before coffee again, felt behind all day." },

  const emptyState = () => ({ v: 2, sample: false, name: "", body: [], attention: [], sessions: [], rules: [], blocked: [], unblockMin: 30, unblockUses: 1,

  function save() {

  // ---------------- derived data ----------------
  const bodySorted = () => [...state.body].sort((a, b) => a.date < b.date ? -1 : 1);
  const bodyOn = k => state.body.find(b => b.date === k);
  const sleepScore = b => b.sleepScore || clamp(Math.round(100 - Math.abs(470 - b.sleepMin) / 2.2), 20, 99);
  function recovery(b, base) { return clamp(Math.round(62 + (b.hrv - base.hrv) * 2.4 + (b.sleepMin - 420) / 5 - (b.rhr - base.rhr) * 2), 5, 99); }
  const baseline = () => { const d = bodySorted().slice(-30); return { hrv: avg(d.map(x => x.hrv)), rhr: avg(d.map(x => x.rhr)) }; };
  const within = (arr, days) => arr.filter(x => (x.date || x.at.slice(0, 10)) > addDays(TODAY, -days));

  function evidence(n, N) { return n >= 8 && N >= 28 ? "Strong evidence" : n >= 4 ? "Some evidence" : "Early signal"; }
  function bodyPatterns() {
    const d = bodySorted(); if (d.length < 14) return [];
    const base = baseline(), out = [];
    const pairs = []; for (let i = 1; i < d.length; i++) if (addDays(d[i - 1].date, 1) === d[i].date) pairs.push([d[i - 1], d[i]]);
    const N = pairs.length;
    const A = pairs.filter(p => p[0].workoutMin > 0), B = pairs.filter(p => !p[0].workoutMin);
    if (A.length >= 3 && B.length >= 3) {
      const ra = Math.round(avg(A.map(p => recovery(p[1], base)))), rb = Math.round(avg(B.map(p => recovery(p[1], base))));
      const hd = Math.round(avg(A.map(p => p[1].hrv)) - avg(B.map(p => p[1].hrv)));
      if (Math.abs(ra - rb) >= 4) out.push({ id: "workout-recovery", text: `After a training day your recovery score is ${ra < rb ? "lower" : "higher"}: ${ra} vs ${rb} on other days (${A.length}/${N} days).`, pill: `HRV ${hd > 0 ? "+" : "−"}${Math.abs(hd)} ms`, tone: hd < 0 ? "bad" : "good", ev: evidence(A.length, N) });

  function mindPatterns() {

  function bodyToday() {
    const d = bodySorted(), t = bodyOn(TODAY), last = t || d[d.length - 1];
    if (!last) return `<section class="card stack"><h3>No Health data yet</h3><p class="sub">Log last night's sleep, your steps and heart numbers. Wren builds your statistics and patterns from them.</p><div><button class="btn" type="button" data-act="logBody">Log today</button></div></section>`;
    const prev = d.filter(x => x.date < last.date).slice(-7);
    const pace = prev.length ? Math.round(last.steps / avg(prev.map(x => x.steps)) * 100) : null;
    const week = Array.from({ length: 7 }, (_, i) => bodyOn(addDays(TODAY, i - 6)));
    return `<div class="stack">
      <section class="card">
        ${!t ? `<p class="sub" style="margin-bottom:14px">Showing ${fmtDay(last.date)}. <button class="link" type="button" data-act="logBody">Log today</button></p>` : ""}
        <div class="metric"><span class="cap">Sleep</span><div class="big">${hm(last.sleepMin)}<small>Sleep score: ${sleepScore(last)}</small></div>${askLink("Was this a good night?")}</div>
        <div class="metric"><span class="cap">Steps</span><div class="big">${num(last.steps)}${pace ? `<small>${pace}% of recent pace</small>` : ""}</div>${askLink("Am I moving enough?")}</div>
        <div class="metric"><span class="cap">Heart</span><div class="pair"><div><div class="big">${last.rhr} bpm</div><div class="sub">Resting heart rate</div></div><div><div class="big">${last.hrv} ms</div><div class="sub">HRV</div></div></div>${askLink("What does this say about recovery?")}</div>
      </section>
      <span class="cap secLabel">Workouts</span>
      <section class="card">
        <h3>${t?.workoutMin ? `${t.workoutType || "Workout"} · ${t.workoutMin} min` : "No workout today"}</h3>
        <div class="weekbars" aria-label="Workouts this week">${week.map(b => `<i class="${b?.workoutMin ? "on" : ""}" title="${b ? fmtDay(b.date) : ""}"></i>`).join("")}</div>
        <div class="row between">${askLink("What would help today?")}<button class="btn grey sm" type="button" data-act="logBody">Log workout</button></div>
      </section></div>`;
  }
  const METRICS = {
    sleep: { label: "Sleep", get: b => b.sleepMin, fmt: v => hm(v), unit: "Average a night", better: 1, delta: v => `${Math.round(v)} min` },
    steps: { label: "Steps", get: b => b.steps, fmt: v => num(v) + " steps", unit: "Average a day", better: 1, delta: v => num(v) },
    rhr: { label: "Resting HR", get: b => b.rhr, fmt: v => Math.round(v) + " bpm", unit: "bpm on average", better: -1, delta: v => Math.round(v) + " bpm" },
    hrv: { label: "HRV", get: b => b.hrv, fmt: v => Math.round(v) + " ms", unit: "ms on average", better: 1, delta: v => Math.round(v) + " ms" },
    workout: { label: "Workouts", get: b => b.workoutMin, fmt: v => Math.round(v) + " min", unit: "Total minutes", better: 1, delta: v => Math.round(v) + " min", total: true }
  };
  function bodyStats() {
    const R = ui.range, keys = Array.from({ length: R }, (_, i) => addDays(TODAY, i - R + 1));
    const prevKeys = Array.from({ length: R }, (_, i) => addDays(TODAY, i - 2 * R + 1));
    const agg = (m, ks) => { const v = ks.map(bodyOn).filter(Boolean).map(METRICS[m].get); return v.length ? (METRICS[m].total ? v.reduce((a, b) => a + b, 0) : avg(v)) : null; };
    const M = METRICS[ui.metric], vals = keys.map(k => { const b = bodyOn(k); return b ? M.get(b) : null; });
    const have = vals.filter(v => v !== null);
    const cur = agg(ui.metric, keys), prev = agg(ui.metric, prevKeys);
    const delta = cur !== null && prev !== null ? cur - prev : null;
    const dTone = delta === null || Math.abs(delta) < 0.5 ? "flat" : (delta * M.better > 0 ? "good" : "bad");
    return `<div class="stack">
      <div class="seg" role="group" aria-label="Range">${[7, 14, 30, 90].map(r => `<button type="button" data-act="range" data-r="${r}" aria-pressed="${R === r}">${r}D</button>`).join("")}</div>
      <div class="tiles">${Object.entries(METRICS).map(([k, m]) => { const v = agg(k, keys); return `<button class="tile" type="button" data-act="metric" data-m="${k}" aria-pressed="${ui.metric === k}"><span class="cap">${m.label}</span><span class="v">${v === null ? "–" : m.fmt(v)}</span><span class="sub">${m.unit}</span></button>`; }).join("")}</div>
      <section class="card chart">
        <div class="row between"><span class="cap">${M.label}, last ${R} days</span>${delta !== null ? `<span class="pill ${dTone}">${delta > 0 ? "+" : delta < 0 ? "−" : ""}${M.delta(Math.abs(delta))}</span>` : ""}</div>
        ${have.length ? barChart(vals, keys, ui.metric) : `<p class="sub" style="padding:40px 0;text-align:center">No ${M.label.toLowerCase()} data in this range.</p>`}
        ${have.length ? `<div class="facts"><div><span>${M.total ? "Total" : "Average"}</span><b>${M.fmt(cur)}</b></div><div><span>Days with data</span><b>${have.length} of ${R}</b></div>
          <div><span>Lowest</span><b>${M.fmt(Math.min(...have))}</b></div><div><span>Highest</span><b>${M.fmt(Math.max(...have))}</b></div></div>` : ""}
      </section>
      ${askLink("How has my " + M.label.toLowerCase() + " changed lately?")}</div>`;
  }
  const SCREEN = { label: "Screen time", fmt: v => hm(v) };
  function barChart(vals, keys, metric) {
    const MM = METRICS[metric] || SCREEN;
    const W = 340, H = 220, L = 34, R = 6, T = 12, B = 28;
    const have = vals.filter(v => v !== null);
    let max = Math.max(...have, 1), ticks;
    if (metric === "sleep") { max = Math.max(480, Math.ceil(max / 120) * 120); ticks = [max / 2, max].map(v => [v, v / 60 + "h"]); }
    else { const step = Math.pow(10, Math.floor(Math.log10(max))); max = Math.ceil(max / step) * step; ticks = [max / 2, max].map(v => [v, v >= 1000 ? (v / 1000) + "k" : String(v)]); }
    const n = vals.length, slot = (W - L - R) / n, bw = Math.max(2, Math.min(10, slot * .45));
    const y = v => T + (1 - v / max) * (H - T - B);
    const every = n <= 7 ? 1 : n <= 14 ? 2 : n <= 30 ? 5 : 15;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${MM.label} by day">
      ${ticks.map(([v, l]) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v) + 4}" font-size="11" fill="var(--muted)">${l}</text>`).join("")}
      <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
      ${vals.map((v, i) => { const cx = L + slot * i + slot / 2; return (v ? `<rect x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - B - y(v))}" rx="${bw / 2}" fill="var(--accent)"><title>${fmtDay(keys[i])}: ${MM.fmt(v)}</title></rect>` : "")
        + ((n - 1 - i) % every === 0 ? `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${n <= 14 ? wd(keys[i]) : fmtDay(keys[i], { day: "numeric" })}</text>` : ""); }).join("")}
    </svg>`;
  }

  // ---- Mindfulness ----
  const BREATHS = {
    box: { name: "Box breathing", why: "For a clear head before a call or a hard decision.", steps: [["Breathe in", 4, 1], ["Hold", 4, 1], ["Breathe out", 4, .55], ["Hold", 4, .55]], shape: "M2,70 L60,10 L120,10 L180,70 L240,70 L300,10 L340,10" },
    "478": { name: "4-7-8 breathing", why: "To quiet a busy mind and fall asleep faster.", steps: [["Breathe in", 4, 1], ["Hold", 7, 1], ["Breathe out", 8, .55]], shape: "M2,70 L50,10 L130,10 L300,70 L340,40" },
    coherent: { name: "Coherent breathing", why: "To steady your heart rate when the day runs fast.", steps: [["Breathe in", 5.5, 1], ["Breathe out", 5.5, .55]], shape: "M2,70 C40,70 50,10 90,10 C130,10 140,70 180,70 C220,70 230,10 270,10 C310,10 320,70 340,70" },
    sigh: { name: "Double sigh", why: "When stress spikes. Two short inhales, one long exhale.", steps: [["Breathe in", 2, .85], ["Top up", 1, 1], ["Long breath out", 6, .55]], shape: "M2,70 L40,25 L60,10 L180,70 L220,25 L240,10 L340,60" }
  };
  const MEDS = {
    relax: { name: "Guided relaxation", why: "To let go of tension when your mind won't slow down.", shape: "M2,40 C45,0 90,0 135,40 S225,80 270,40 S330,10 340,20" },
    scan: { name: "Body scan", why: "To notice where you hold stress, from head to toe.", shape: "M2,40 C30,20 60,60 90,40 S150,20 180,40 S240,60 270,40 S330,20 340,30" }
  };
  function practiceCard(key, p, act) {
    return `<section class="card practice"><svg class="shape" viewBox="0 0 342 80" preserveAspectRatio="none" aria-hidden="true"><path d="${p.shape}"/></svg>
      <h2 class="headline">${p.name}</h2><p class="why">${p.why}</p>${act === "med" ? '<span class="cap" style="text-transform:none;letter-spacing:0;font-weight:600">Voice-guided</span>' : ""}
      <div class="seg white" role="group" aria-label="Length">${[2, 5, 10].map(m => `<button type="button" data-act="dur" data-k="${key}" data-m="${m}" aria-pressed="${ui.dur[key] === m}">${m} min</button>`).join("")}</div>
      <button class="btn block" type="button" data-act="${act}" data-k="${key}">Start</button></section>`;
  }
  function mindNote() {
    const d = bodySorted(), t = d[d.length - 1], base = d.slice(-15, -1);
    if (t && base.length >= 5 && t.sleepMin < avg(base.map(b => b.sleepMin)) - 20) return `A shorter night than usual (${hm(t.sleepMin)}). Two minutes of box breathing could take the edge off.`;
    if (t && base.length >= 5 && t.hrv < avg(base.map(b => b.hrv)) - 4) return "Your HRV is below your normal today. A slow breathing round can help you recover.";
    const r = state.rules.find(r => r.on);
    if (r) return `Two minutes of box breathing before ${esc(r.name.toLowerCase())} at ${r.from}?`;
    return "You haven't taken a breathing break today. Two minutes before your next call?";
  }
  function mindBreath() {
    return `<div class="stack">
      ${noticed({ key: "mind", note: mindNote(), headline: "A calmer you, in a few minutes.", feats: [["wave", "Four ways to breathe, two to ten minutes"], ["moon", "Guided relaxation, voiced by Wren"], ["heart", "See what each practice does for you"]], primary: ["Breathe for 2 min", "quickBreath"], secondary: "Not now" })}
      ${Object.entries(BREATHS).map(([k, p]) => practiceCard(k, p, "breathe")).join("")}
      ${state.sessions.length ? `<section class="card"><span class="cap">Recent sessions</span><div class="list">${state.sessions.slice(-4).reverse().map(s => `<div class="li"><span>${esc(s.kind)}</span><span class="v">${s.min} min · ${fmtDay(s.date)}</span></div>`).join("")}</div></section>` : ""}</div>`;
  }
  function mindMed() { return `<div class="stack">${Object.entries(MEDS).map(([k, p]) => practiceCard(k, p, "med")).join("")}</div>`; }

  // ---- Attention ----
  function activeRule() {
    const d = new Date(), t = d.toTimeString().slice(0, 5), day = d.getDay();
    const inRange = (f, to) => f <= to ? t >= f && t < to : t >= f || t < to;
    const r = state.rules.find(r => r.on && r.days.includes(day) && inRange(r.from, r.to));
    if (r) return r.name;
    if (state.night.on && inRange(state.night.from, state.night.to)) return "At night";
    return null;
  }
  function attnToday() {
    const a = state.attention.find(x => x.date === TODAY);
    const note = a ? `You picked up your phone ${a.pickups} times today. Want a quiet hour?` : state.attention.length ? `Yesterday you spent ${hm(state.attention[state.attention.length - 1].screenMin)} on screens. Log today's to compare.` : "Log today's screen time and Wren will show where your attention goes.";
    const act = activeRule();
    return `<div class="stack">
      ${noticed({ key: "attn", note, headline: "See where your attention goes.", feats: [["attn", "Screen time and pickups, day by day"], ["lock", "Rules that hold you to your focus times"], ["moon", "A quieter night, on a schedule"]], primary: [a ? "Update today's screen time" : "Log screen time", "logScreen"], secondary: null })}
      ${act ? `<section class="card row" style="flex-wrap:nowrap">${ic("lock")}<div><h3>${esc(act)} is on</h3><p class="sub">Your blocked apps: ${esc(state.blocked.join(", ") || "none yet")}. Keep them closed until it ends.</p></div></section>` : ""}
      ${a ? `<section class="card"><div class="pair"><div class="metric"><span class="cap">Screen time</span><div class="big">${hm(a.screenMin)}</div></div><div class="metric"><span class="cap">Pickups</span><div class="big">${a.pickups}</div></div></div>${askLink("How do I cut my pickups?")}</section>` : ""}
      <p class="sub" style="padding:0 6px">Wren can't read Screen Time or block apps from the browser. Copy your numbers from your phone's Screen Time settings.</p></div>`;
  }
  const DAYN = ["S", "M", "T", "W", "T", "F", "S"];
  function attnRules() {
    return `<div class="stack">
      <span class="cap secLabel">Restriction rules</span>
      <div class="rules">${state.rules.map(r => `<div class="card rule"><div class="row between" style="flex-wrap:nowrap"><h3>${esc(r.name)}</h3><button class="switch" type="button" role="switch" aria-checked="${r.on}" data-act="ruleToggle" data-id="${r.id}" aria-label="Turn ${esc(r.name)} on or off"></button></div>
          <div><div class="big" style="font-size:20px">${r.from}–${r.to}</div><div class="sub">${r.days.length === 7 ? "Every day" : r.days.map(d => DAYN[d]).join(" ")}</div></div>
          <button class="link" type="button" data-act="ruleEdit" data-id="${r.id}" style="align-self:flex-start">Edit</button></div>`).join("")}
        <button class="card rule new" type="button" data-act="ruleEdit">${ic("plus")}New rule</button></div>
      <span class="cap secLabel">At night</span>
      <section class="card list" style="padding-block:6px">
        <div class="li"><span>Quiet night</span><button class="switch" type="button" role="switch" aria-checked="${state.night.on}" data-act="nightToggle" aria-label="Quiet night"></button></div>
        <div class="li"><label for="nFrom">From</label><input id="nFrom" type="time" value="${state.night.from}" data-set="night.from" class="bare" style="border:0;background:none;color:var(--muted)"></div>
        <div class="li"><label for="nTo">Until</label><input id="nTo" type="time" value="${state.night.to}" data-set="night.to" style="border:0;background:none;color:var(--muted)"></div></section>
      <span class="cap secLabel">Emergency unblock</span>
      <section class="card list" style="padding-block:6px">
        <div class="li"><label for="ubMin">Unblock for</label><select id="ubMin" class="bare" data-set="unblockMin">${[5, 15, 30, 60].map(m => `<option value="${m}" ${state.unblockMin === m ? "selected" : ""}>${m} min</option>`).join("")}</select></div>
        <div class="li"><label for="ubUses">Uses per week</label><select id="ubUses" class="bare" data-set="unblockUses">${[0, 1, 2, 3, 5].map(m => `<option value="${m}" ${state.unblockUses === m ? "selected" : ""}>${m === 1 ? "1 time" : m + " times"}</option>`).join("")}</select></div></section>
      <span class="cap secLabel">Blocked during focus</span>
      <section class="card stack" style="align-items:center">
        ${state.blocked.length ? `<div class="chips" style="justify-content:center">${state.blocked.map((b, i) => `<span class="chip">${esc(b)}<button type="button" data-act="unblockApp" data-i="${i}" aria-label="Remove ${esc(b)}">${ic("x").replace('class="i"', 'class="i" style="width:16px;height:16px"')}</button></span>`).join("")}</div>` : ""}
        <button class="btn soft" type="button" data-act="addApps">${ic("plus")} Add apps</button></section></div>`;
  }
  function attnAnalytics() {
    const span = { week: 7, month: 30, all: 365 }[ui.aRange];
    const rows = state.attention.filter(a => a.date > addDays(TODAY, -span)).sort((a, b) => a.date < b.date ? -1 : 1);
    const n = ui.aRange === "all" ? Math.max(7, rows.length ? Math.round((new Date(TODAY) - new Date(rows[0].date)) / 864e5) + 1 : 7) : span;
    const keys = Array.from({ length: Math.min(n, 90) }, (_, i) => addDays(TODAY, i - Math.min(n, 90) + 1));
    const vals = keys.map(k => state.attention.find(a => a.date === k)?.screenMin ?? null);
    const range = `${fmtDay(keys[0], { month: "long", day: "numeric", year: "numeric" })} – ${fmtDay(TODAY, { month: "long", day: "numeric", year: "numeric" })}`;
    return `<div class="stack"><span class="cap secLabel">Screen time</span>
      <section class="card chart">
        <div class="seg" role="group" aria-label="Range">${[["week", "Week"], ["month", "Month"], ["all", "All time"]].map(([k, l]) => `<button type="button" data-act="aRange" data-r="${k}" aria-pressed="${ui.aRange === k}">${l}</button>`).join("")}</div>
        <p class="sub" style="margin-top:16px">${range}</p>
        <p class="sub" style="margin-top:8px">Screen time, daily average</p>
        <div class="big" style="color:var(--accent);font-size:36px">${rows.length ? hm(avg(rows.map(r => r.screenMin))) : "0m"}</div>
        ${rows.length ? barChart(vals, keys, "screen") + `<div class="facts"><div><span>Pickups a day</span><b>${Math.round(avg(rows.map(r => r.pickups)))}</b></div><div><span>Days logged</span><b>${rows.length}</b></div></div>`
          : `<p class="sub" style="text-align:center;padding:60px 0">No screen time data yet.</p>`}
      </section></div>`;
  }

  // ---- Commitments ----
  const TEMPLATES = {
    goal: [
      { cat: "Health", title: "Run my first race", d: "5K or longer, by a race you pick", step: "First step: 3 easy runs this week" },
      { cat: "Money", title: "Save for something", d: "Your amount, by your date", step: "First step: move a set amount on payday" },
      { cat: "Learning", title: "Read 12 books this year", d: "One a month, any kind", step: "First step: pick this month's book tonight" },
      { cat: "Rest", title: "Sleep 7 hours most nights", d: "5 nights out of 7, for a month", step: "First step: set a wind-down alarm" }
    ],
    habit: [
      { cat: "Rest", title: "Read before bed", d: "After I get into bed", days: "Every day", bad: "On a bad day: one page still counts" },
      { cat: "Health", title: "Go for a run", d: "After I get up", days: "Mon, Wed, Fri", bad: "On a bad day: walk round the block" },
      { cat: "Mind", title: "Breathe for two minutes", d: "After my first coffee", days: "Every day", bad: "On a bad day: three slow breaths" },
      { cat: "People", title: "Message a friend", d: "After lunch", days: "Every day", bad: "On a bad day: send one emoji" }
    ]
  };
  function commitList() {
    const active = state.commitments;
    const started = new Set(active.map(c => c.title));
    const streak = c => { let s = 0, k = c.log.includes(TODAY) ? TODAY : addDays(TODAY, -1); while (c.log.includes(k)) { s++; k = addDays(k, -1); } return s; };
    const block = (kind, title, sub, icon, tint, tintSoft, info) => `<section class="card">
      <div class="ctop"><span class="ic" style="background:${tintSoft};color:${tint}">${ic(icon)}</span><h3>${title}</h3><button class="info" type="button" data-act="info" data-k="${kind}" aria-label="About ${title.toLowerCase()}">${ic("info")}</button></div>
      ${ui.info[kind] ? `<p class="sub" style="margin-top:14px">${info}</p>` : ""}
      <p class="sub" style="margin-top:16px;font-size:16px">${sub}</p>
      <div class="carousel">${TEMPLATES[kind].map((t, i) => `<div class="tpl"><span class="cat" style="color:${tint}">${t.cat}</span><h4>${t.title}</h4><span class="d">${t.d}</span>${t.days ? `<span class="d">${t.days}</span>` : ""}
        <div class="step">${ic(kind === "goal" ? "arrow" : "clock").replace('class="i"', `class="i" style="color:${tint}"`)}<span>${t.step || t.bad}</span></div>
        <button class="btn sm" type="button" data-act="startTpl" data-kind="${kind}" data-i="${i}" ${started.has(t.title) ? "disabled" : ""}>${started.has(t.title) ? "Started" : "Start this " + kind}</button></div>`).join("")}</div>
      <button class="btn soft" type="button" data-act="ownCommit" data-kind="${kind}" style="margin-top:18px">${ic("plus")} Set your own ${kind}</button></section>`;
    return `<div class="stack">
      ${active.length ? `<span class="cap secLabel">In progress</span><section class="card list" style="padding-block:4px">${active.map(c => `<div class="li"><div class="active-c"><button class="check" type="button" data-act="logCommit" data-id="${c.id}" aria-pressed="${c.log.includes(TODAY)}" aria-label="Done today">${ic("check")}</button>
        <div><b style="font-weight:600">${esc(c.title)}</b><div class="sub">${c.kind === "habit" ? `${esc(c.when || "")} · ${streak(c)} day streak` : `${esc(c.step || "")} · ${c.log.length} check-ins`}</div></div></div>
        <button class="close" type="button" data-act="dropCommit" data-id="${c.id}" aria-label="Remove ${esc(c.title)}">${ic("x").replace('class="i"', 'class="i" style="width:16px;height:16px"')}</button></div>`).join("")}</section>` : ""}
      ${block("goal", "Goals", "Something with a finish line. A few to start from:", "goal", "var(--violet)", "var(--violet-soft)", "A goal ends when you reach it. Wren breaks it into a first step and checks in as you go.")}
      ${block("habit", "Habits", "Something small, tied to a moment you already have:", "sprout", "var(--accent)", "var(--accent-soft)", "A habit is tied to something you already do, with a smaller version for bad days so the chain doesn't break.")}</div>`;
  }

  // ---- Reflection ----
  function reflectNote() {
    const j = state.journal, p = reflectPatterns()[0];
    if (j.length >= 3 && p) return `${j.length} entries in, ${p.text.charAt(0).toLowerCase() + p.text.slice(1).replace(/ \(.*\)\.$/, ".")}`;
    if (j.length) return `Last entry ${fmtDay(j[j.length - 1].at.slice(0, 10), { weekday: "long" })}. Two lines about today?`;
    return "Two lines is enough. What stood out today?";
  }
  function reflectJournal() {
    const j = [...state.journal].sort((a, b) => a.at < b.at ? 1 : -1);
    return `<div class="stack">
      ${noticed({ key: "reflect", note: reflectNote(), headline: "Understand your week, in your own words.", feats: [["pencil", "Two lines a day, whenever you like"], ["reflect", "Your week read back after three days"], ["mind", "Wren spots patterns in how you feel"]], primary: null, secondary: "Got it" })}
      ${j.length ? `<section class="card">${j.map(e => `<div class="entry"><div class="row between"><time>${fmtDay(e.at.slice(0, 10), { weekday: "short", day: "numeric", month: "short" })} · ${e.at.slice(11, 16)}</time><button class="link" type="button" data-act="delEntry" data-id="${e.id}" style="font-size:13px">Delete</button></div><p>${esc(e.text)}</p></div>`).join("")}</section>` : ""}

    const finish = done => { endOverlay(); logSession(p.name, done ? mins : (Date.now() - t0) / 60000); render(); };
    $("#ovStop").onclick = () => finish(false);
    const pulse = setInterval(() => { const o = $("#orb"); if (!o) return clearInterval(pulse); o.style.transform = `scale(${breathe ? .85 : .6})`; breathe = !breathe; }, 5000);
    function say() {
      if (!$("#ov")) return;
      if (i >= lines.length) { timer = setTimeout(() => finish(true), 4000); return; }
      $("#cap").textContent = lines[i];
      if (voice) { try { const u = new SpeechSynthesisUtterance(lines[i]); u.rate = .85; u.pitch = 1; speechSynthesis.speak(u); } catch {} }
      i++; timer = setTimeout(say, gap);
    }
    say();
  }

  // ---------------- summaries ----------------
  async function summarise() {
    const ws = weekStart(), entries = state.journal.filter(e => e.at.slice(0, 10) >= ws);
    const sample = await getSample();
    if (!sample) { toast("Reading back your week needs Claude, which this view can't reach"); return; }
    state.summaries[ws] = "Reading your week…"; render();
    try {
      const { text } = await sample(`You are Wren, a calm companion app. Read back this person's journal for the week in 3–4 short sentences: what the days had in common, what seemed to help, and one gentle suggestion. Speak to them as "you". Don't invent details.\n\n${entries.map(e => `${e.at.replace("T", " ")}: ${e.text}`).join("\n")}`, { cache: false, onText: ({ text }) => { state.summaries[ws] = text; const el = document.querySelector(".card h3 + p"); if (el) el.textContent = text; } });
      state.summaries[ws] = text;
    } catch (e) { delete state.summaries[ws]; toast(e?.code === "rate_limited" ? "Too many requests. Try again in a minute." : "Couldn't read your week back. Try again."); }
    save(); render();
  }

  // ---------------- actions ----------------
  const A = {
    menu: () => document.body.classList.add("open"),
    go: b => go(b.dataset.sec),
    tab: b => go(ui.sec, b.dataset.sub),
    senses: () => { document.body.classList.remove("open"); sensesSheet(); },
    settings: () => { document.body.classList.remove("open"); closeSheet(); settingsSheet(); },
    fresh: () => { closeSheet(); state = Object.assign(emptyState(), { name: state.name }); save(); toast("Sample data cleared"); render(); },
    ask: b => { closeSheet(); go("chat"); send(b.dataset.q); },
    send: () => send(),
    clearChat: () => { state.chat = []; save(); render(); },
    logBody: () => { closeSheet(); logBodySheet(); },
    logScreen: () => { closeSheet(); logScreenSheet(); },
    write: () => { closeSheet(); writeSheet(); },
    range: b => { ui.range = +b.dataset.r; render(); },
    metric: b => { ui.metric = b.dataset.m; render(); },
    aRange: b => { ui.aRange = b.dataset.r; render(); },
    notMe: b => { state.dismissed.push(b.dataset.id); save(); toast("Got it. Wren won't show that one again."); render(); },
    seen: b => { state.seen[b.dataset.key] = true; save(); render(); },
    dur: b => { ui.dur[b.dataset.k] = +b.dataset.m; render(); },
    breathe: b => startBreath(b.dataset.k, ui.dur[b.dataset.k]),
    quickBreath: () => startBreath("box", 2),
    med: b => startMed(b.dataset.k, ui.dur[b.dataset.k]),
    ruleToggle: b => { const r = state.rules.find(x => x.id === b.dataset.id); r.on = !r.on; save(); render(); },
    ruleEdit: b => ruleSheet(b.dataset.id),
    nightToggle: () => { state.night.on = !state.night.on; save(); render(); },
    addApps: () => addAppsSheet(),
    unblockApp: b => { state.blocked.splice(+b.dataset.i, 1); save(); render(); },
    info: b => { ui.info[b.dataset.k] = !ui.info[b.dataset.k]; render(); },
    startTpl: b => { const t = TEMPLATES[b.dataset.kind][+b.dataset.i]; state.commitments.push({ id: "c" + uid(), kind: b.dataset.kind, cat: t.cat, title: t.title, step: t.step ? t.step.replace("First step: ", "") : "", when: t.d, bad: t.bad || "", log: [] }); save(); toast("Started: " + t.title); render(); },
    ownCommit: b => ownCommitSheet(b.dataset.kind),
    logCommit: b => { const c = state.commitments.find(x => x.id === b.dataset.id); c.log = c.log.includes(TODAY) ? c.log.filter(k => k !== TODAY) : [...c.log, TODAY]; save(); render(); },
    dropCommit: b => { state.commitments = state.commitments.filter(x => x.id !== b.dataset.id); save(); render(); },
    delEntry: b => { state.journal = state.journal.filter(e => e.id !== b.dataset.id); save(); render(); },
    summarise: () => summarise()
  };
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    A[b.dataset.act]?.(b);
  });
  document.addEventListener("change", e => {
    const el = e.target.closest("[data-set]"); if (!el) return;
    const path = el.dataset.set.split("."), v = el.type === "time" ? el.value : +el.value;
    if (path.length === 2) state[path[0]][path[1]] = v; else state[path[0]] = v;
    save();
  });
  $("#shield").onclick = () => document.body.classList.remove("open");
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#ov")) endOverlay(); else if ($("#scrim")) closeSheet(); else document.body.classList.remove("open"); } });
  matchMedia("(min-width: 900px)").addEventListener?.("change", render);

  render();
})();
</script>
</body></html>
