<title>Year One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column, a sticky day header, a fixed bottom tab bar; the 365-cell year grid is the signature. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16201B; --muted:#5B6862; --line:#D9E0DB;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --sun:#B4650F; --sun-soft:#F6E5CE; --danger:#B3362B; --frost:#2F6FA0; --frost-soft:#DCEAF5; --boss:#8A2E4A; --boss-soft:#F3DDE4;
  --h0:#E2E8E3; --h1:#BCDACB; --h2:#82BDA3; --h3:#3C9173; --h4:#1E6B57;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --ink:#E5ECE8; --muted:#94A49B; --line:#26332D;
  --accent:#5CC29E; --accent-ink:#0A1310; --accent-soft:#1B372D;
  --sun:#E9A04A; --sun-soft:#3A2A15; --danger:#EE7B6F; --frost:#7DB8E0; --frost-soft:#16293A; --boss:#E58AA6; --boss-soft:#3A1B26;
  --h0:#1D2823; --h1:#22463A; --h2:#2D6C55; --h3:#44A07D; --h4:#70D4AD; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --ink:#E5ECE8; --muted:#94A49B; --line:#26332D;
  --accent:#5CC29E; --accent-ink:#0A1310; --accent-soft:#1B372D;
  --sun:#E9A04A; --sun-soft:#3A2A15; --danger:#EE7B6F; --frost:#7DB8E0; --frost-soft:#16293A; --boss:#E58AA6; --boss-soft:#3A1B26;
  --h0:#1D2823; --h1:#22463A; --h2:#2D6C55; --h3:#44A07D; --h4:#70D4AD; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:8px 110px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f,div.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);min-width:0}
label.f > span,div.f > span{font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .row{flex-wrap:nowrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.sync{font-family:var(--mono);font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero .why{font-style:italic;color:var(--muted);margin-top:6px}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--mono);font-weight:700;font-size:1.15rem;line-height:1.1}
.ring .lbl small{display:block;font-size:.62rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.sun{background:var(--sun-soft);border-color:transparent;color:var(--sun);font-weight:700}
.datenav{display:flex;gap:8px;align-items:center}

/* phase bar */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.phase{height:6px;border-radius:3px;background:var(--h0);position:relative;overflow:hidden}
.phase b{position:absolute;inset:0;background:var(--accent);transform-origin:left}
.phase-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.phase-l .cur{color:var(--accent);font-weight:700}

/* focus */
.focus{background:var(--sun-soft);border-color:transparent}
.focus .eyebrow{color:var(--sun)}
.check{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:none;border:0;padding:6px 0}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.box svg{width:14px;height:14px;opacity:0}
.on .box{background:var(--accent);border-color:var(--accent)}
.on .box svg{opacity:1}
.focus .on .box{background:var(--sun);border-color:var(--sun)}
.check .t{flex:1;min-width:0}
.on .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

/* area habit blocks */
.area{display:flex;flex-direction:column;gap:2px;padding-block:10px;border-top:1px solid var(--line)}
.area:first-of-type{border-top:0;padding-top:0}
.area-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.area-h h3{font-size:.98rem}
.area-h .pct{margin-left:auto;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px;padding:6px 0}
.stepper .n{font-family:var(--mono);font-weight:700;min-width:2ch;text-align:center}

/* scale buttons */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 0;font-family:var(--mono);font-weight:700}
.scale button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale-l{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile .v{font-family:var(--mono);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .k{font-size:.76rem;color:var(--muted)}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}.tiles.t3{grid-template-columns:repeat(3,1fr)}}

/* heatmap */
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;width:max-content}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat i.today{outline:2px solid var(--sun);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:5.2rem 1fr 3rem;align-items:center;gap:10px;font-size:.88rem}
.bar .track{height:9px;border-radius:5px;background:var(--h0);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .num{font-family:var(--mono);font-size:.78rem;text-align:right;color:var(--muted)}
.spark{width:100%;height:80px;display:block}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.pill{font-family:var(--mono);font-size:.68rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.pill.reading{background:var(--sun-soft);color:var(--sun);border-color:transparent}
.pill.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--danger)}
details.area-card > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.area-card > summary::-webkit-details-marker{display:none}
details.area-card > summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
details.area-card[open] > summary .chev{transform:rotate(90deg)}
.goal-line{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.addrow3{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}
@media (max-width:480px){.addrow3{grid-template-columns:1fr 1fr}.addrow3 .btn{grid-column:span 2}}
.month{display:grid;grid-template-columns:2.6rem 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.month:first-child{border-top:0}
.month .mn{font-family:var(--mono);font-weight:700;color:var(--muted)}
.month.cur .mn{color:var(--sun)}
.month.cur h3{color:var(--sun)}
.review{border-top:1px solid var(--line);padding-top:10px}
.review:first-child{border-top:0;padding-top:0}
.confirm{background:var(--sun-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:none;padding:6px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--muted);font-weight:700}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.act{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.88rem;z-index:20}

/* game */
.lvl{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-width:0}
.lvl .badge-n{font-family:var(--mono);font-weight:700;font-size:.72rem;background:var(--sun);color:var(--surface);border-radius:7px;padding:3px 7px;white-space:nowrap}
.lvl .xpbar{width:64px;height:6px;border-radius:3px;background:var(--h0);overflow:hidden}
.lvl .xpbar b{display:block;height:100%;background:var(--sun)}
.top-r{display:flex;align-items:center;gap:12px;min-width:0}
@media (max-width:420px){.sync span{display:none}}
.chip.frost{background:var(--frost-soft);color:var(--frost);border-color:transparent;font-weight:700}
.chip.xp{background:var(--surface);color:var(--sun);font-weight:700}
.bounty{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.05em;color:var(--sun);background:var(--sun-soft);border-radius:5px;padding:2px 6px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.boss{background:var(--boss-soft);border-color:transparent}
.boss .eyebrow{color:var(--boss)}
.hp{height:14px;border-radius:7px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.hp b{display:block;height:100%;background:var(--boss);transition:width .5s}
.boss.down .hp b{background:var(--accent)}
.hero-lvl{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.medal{width:96px;height:96px;border-radius:50%;background:var(--sun);color:var(--surface);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;line-height:1;box-shadow:inset 0 0 0 6px color-mix(in srgb, var(--surface) 25%, transparent)}
.medal span{font-size:2.4rem}.medal small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;font-weight:700}
.bigbar{height:12px;border-radius:6px;background:var(--h0);overflow:hidden}
.bigbar b{display:block;height:100%;background:var(--sun);transition:width .5s}
.stat{display:grid;grid-template-columns:3.2rem 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.stat:first-child{border-top:0}
.stat .ab{font-family:var(--mono);font-weight:700;font-size:.78rem;color:var(--accent)}
.stat .nm{font-size:.9rem;min-width:0}
.stat .nm small{color:var(--muted)}
.stat .lv{font-family:var(--mono);font-weight:700;font-size:.85rem}
.stat .bigbar{height:6px;margin-top:4px}
.stat .bigbar b{background:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.bdg .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun)}
.bdg .ic svg{width:20px;height:20px}
.bdg b{font-family:var(--display);font-size:.95rem;line-height:1.2}
.bdg p{font-size:.78rem;color:var(--muted);line-height:1.35}
.bdg.locked{background:transparent;border-style:dashed}
.bdg.locked .ic{background:var(--h0);color:var(--muted)}
.bdg.locked b{color:var(--muted)}
.prog{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.xptable{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.88rem}
.xptable span:nth-child(even){font-family:var(--mono);color:var(--sun);font-weight:700;text-align:right}
.heat i.frz{background:var(--frost-soft);box-shadow:inset 0 0 0 1.5px var(--frost)}
.floatxp{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-weight:700;color:var(--sun);font-size:1rem;animation:floatup 1s ease-out forwards;text-shadow:0 1px 0 var(--surface)}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-48px)}}
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb, var(--ink) 55%, transparent);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:340px;width:100%;text-align:center;align-items:center;gap:10px;padding:24px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:41}
@media (prefers-reduced-motion: reduce){.floatxp{animation:none;opacity:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="row between">
      <div class="brand">Year One</div>
      <div class="top-r">
        <div class="sync" id="sync"><i></i><span>Saved on this device</span></div>
        <button class="lvl" id="lvl" data-tab="hero" aria-label="Open your hero page"></button>
      </div>
    </div>
  </header>
  <main id="main" class="stack" style="gap:20px"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden></div>
<canvas id="confetti" hidden></canvas>

  const hs = allHabits(); if (!hs.length) return 0;

}

/* Streak counts days at 50%+. Every 7 straight days earns a freeze (max 2) that covers one missed day. */
function streaks(){
  const t = todayStr(), start = P().startDate, span = diffDays(start, t);
  let run = 0, best = 0, fr = 0, earn = 0; const frozen = new Set();
  for (let i = 0; i <= span; i++){
    const s = addDays(start, i);
    if (score(s) >= .5){ run++; best = Math.max(best, run); if (++earn === 7){ fr = Math.min(2, fr+1); earn = 0; } }
    else if (s === t) {}
    else if (fr > 0 && run > 0){ fr--; frozen.add(s); }
    else { run = 0; earn = 0; }
  }
  return {cur:run, best, freezes:fr, frozen};
}
function areaRate(areaId, days = 30){
  const hs = P().areas[areaId]?.habits || []; if (!hs.length) return 0;
  const t = todayStr(); let tot = 0, done = 0;
  for (let i = 0; i < days; i++){ const s = addDays(t, -i); if (diffDays(P().startDate, s) < 0) break; const h = day(s).h || {}; hs.forEach(x => { tot++; if (h[x.id]) done++; }); }
  return tot ? done / tot : 0;
}

/* ---------- game engine (everything derived from the log, nothing stored) ---------- */
function hash(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function bounties(s){
  const ids = allHabits().map(h => h.id); const out = new Set(); let h = hash(s);
  while (out.size < Math.min(3, ids.length)){ out.add(ids[h % ids.length]); h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0; }
  return out;
}
const levelFor = xp => { let L = 1; while (50*(L+1)*L <= xp) L++; return L; };

const areaLevel = xp => Math.floor(Math.sqrt(xp/40)) + 1;
const areaXpAt = L => 40*(L-1)*(L-1);
function weekBoss(monday){
  const hs = allHabits().length, start = P().startDate;

  for (let i = 0; i < 7; i++){ const s = addDays(monday, i); if (diffDays(start, s) < 0) continue; slots += hs; dmg += Object.values(day(s).h || {}).filter(Boolean).length; }
  const hp = Math.max(1, Math.round(slots * .7));
  const idx = Math.max(0, Math.floor(diffDays(mondayOf(start), monday)/7)) % BOSSES.length;
  return {name:BOSSES[idx], hp, dmg:Math.min(dmg, hp), down: slots > 0 && dmg >= hp};
}
function game(){
  const p = P(), habitArea = {};
  allHabits().forEach(h => habitArea[h.id] = h.area);
  const area = {}; AREAS.forEach(a => area[a.id] = 0);
  const count = {}; let xp = 0, ticks = 0, perfect = 0, letgo = 0;
  Object.keys(state.days).forEach(s => {
    const d = state.days[s], h = d.h || {}, b = bounties(s);
    Object.keys(h).forEach(id => { if (!h[id]) return; ticks++; count[id] = (count[id]||0)+1;
      const g = XP.habit + (b.has(id) ? XP.bounty : 0); xp += g; if (habitArea[id]) area[habitArea[id]] += g; });
    if (allHabits().length && score(s) >= 1){ perfect++; xp += XP.perfect; }
    if (d.mood || d.energy) xp += XP.checkin;
    if ((d.grat || "").trim()) xp += XP.grat;
    const lg = Number(d.letgo)||0; letgo += lg; xp += lg*XP.letgo; area.less += lg*XP.letgo;
  });

  const reviews = Object.values(p.reviews).filter(r => Object.values(r).some(v => String(v).trim())).length; xp += reviews*XP.review;
  const books = p.books.filter(b => b.status === "done").length; xp += books*XP.book; area.read += books*XP.book;
  xp += p.weights.length*XP.weigh; area.look += p.weights.length*XP.weigh;

  p.lifts.slice().sort((a,b) => a.d < b.d ? -1 : 1).forEach(l => { const k = l.ex.trim().toLowerCase(); if (best[k] !== undefined && Number(l.w) > best[k]) pbs++; best[k] = Math.max(best[k] ?? -Infinity, Number(l.w)); });

  const badges = BADGES.map(([id,name,desc,icon,fn]) => { const [have, need] = fn(ctx); return {id, name, desc, icon, have:Math.min(have, need), need, got: have >= need}; });
  let today = 0; { const d = day(t), h = d.h || {}, b = bounties(t);
    Object.keys(h).forEach(id => { if (h[id]) today += XP.habit + (b.has(id) ? XP.bounty : 0); });
    if (allHabits().length && score(t) >= 1) today += XP.perfect; if (d.mood || d.energy) today += XP.checkin; if ((d.grat||"").trim()) today += XP.grat; today += (Number(d.letgo)||0)*XP.letgo; }

}

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const main = document.getElementById("main");
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }
function ring(sc){
  const r = 40, c = 2*Math.PI*r;
  return `<div class="ring" role="img" aria-label="${Math.round(sc*100)}% of today's habits done"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--h0)" stroke-width="9"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-sc)}" style="transition:stroke-dashoffset .4s"/></svg><div class="lbl"><div>${Math.round(sc*100)}%<small>TODAY</small></div></div></div>`;
}
function spark(points, opts = {}){
  if (points.length < 2) return `<p class="muted" style="font-size:.88rem">${opts.empty || "Add two or more entries to see a trend."}</p>`;
  const W = 600, H = 80, pd = 8;
  const vs = points.map(p => p.v); let lo = opts.lo ?? Math.min(...vs), hi = opts.hi ?? Math.max(...vs); if (hi === lo){ hi += 1; lo -= 1; }
  const xs = i => pd + i*(W-2*pd)/(points.length-1), ys = v => H-pd - (v-lo)*(H-2*pd)/(hi-lo);
  const line = points.map((p,i) => `${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join(" ");
  const area = `${pd},${H-pd} ${line} ${xs(points.length-1).toFixed(1)},${H-pd}`;
  const L = points[points.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <polygon points="${area}" fill="var(--accent-soft)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${xs(points.length-1)}" cy="${ys(L.v)}" r="4" fill="var(--sun)"/></svg>`;
}

function viewYear(){

  const lead = (parse(start).getDay()+6)%7;
  let cells = "";

    const s = addDays(start, i);

    cells += `<i class="${fut ? "fut" : st.frozen.has(s) ? "frz" : "l"+level(sc)} ${s === t ? "today" : ""}" title="Day ${i+1} · ${fmtShort(s)} · ${Math.round(sc*100)}%"></i>`;

      <div class="eyebrow">${g.xp.toLocaleString()} XP total</div>
      <h1>${esc(g.title)}</h1>
      <div class="bigbar" role="img" aria-label="${into} of ${need} XP to the next level"><b style="width:${Math.round(into/need*100)}%"></b></div>
      <p class="muted" style="font-size:.88rem">${(need-into).toLocaleString()} XP to level ${g.level+1}${next ? ` · "${esc(next[1])}" at level ${next[0]}` : ""}</p>
    </div>
  </section>
  <section class="tiles t3">
    <div class="tile"><div class="v">${g.st.cur}</div><div class="k">Day streak</div></div>
    <div class="tile"><div class="v">${g.bosses}</div><div class="k">Bosses defeated</div></div>
    <div class="tile"><div class="v">${got}/${g.badges.length}</div><div class="k">Badges</div></div>
  </section>
  <section class="card">
    <div class="row between"><h2>Character stats</h2><span class="muted" style="font-size:.85rem">Each area levels up on its own</span></div>
    <div>${AREAS.map(a => { const x = g.area[a.id] || 0, L = areaLevel(x), lo = areaXpAt(L), hi = areaXpAt(L+1);
      return `<div class="stat"><span class="ab">${STATS[a.id][0]}</span><div class="nm">${STATS[a.id][1]} <small>· ${esc(a.name)}</small><div class="bigbar"><b style="width:${Math.round((x-lo)/(hi-lo)*100)}%"></b></div></div><span class="lv">LV ${L}</span></div>`; }).join("")}</div>
  </section>
  <section class="card">
    <div class="row between"><h2>Badges</h2><span class="mono muted" style="font-size:.85rem">${got} unlocked</span></div>
    <div class="badges">${g.badges.filter(b => b.got).map(badge).join("")}${g.badges.filter(b => !b.got).sort((a,b) => b.have/b.need - a.have/a.need).map(badge).join("")}</div>
  </section>
  <section class="card">
    <h2>How to earn XP</h2>
    <div class="xptable">
      <span>Tick a habit</span><span>+${XP.habit}</span>
      <span>Tick one of today's 3 bounty habits</span><span>+${XP.habit + XP.bounty}</span>
      <span>Perfect day (every habit)</span><span>+${XP.perfect}</span>
      <span>Mood or energy check-in</span><span>+${XP.checkin}</span>
      <span>Write something you're grateful for</span><span>+${XP.grat}</span>
      <span>Each item let go</span><span>+${XP.letgo}</span>
      <span>Monthly quest task</span><span>+${XP.mtask}</span>
      <span>Weekly review</span><span>+${XP.review}</span>
      <span>Defeat the weekly boss</span><span>+${XP.boss}</span>
      <span>Finish a book</span><span>+${XP.book}</span>
      <span>Log a lift · beat a personal best</span><span>+${XP.lift} · +${XP.pb}</span>
      <span>Weigh-in</span><span>+${XP.weigh}</span>
      <span>Side-hustle income entry</span><span>+${XP.income}</span>
    </div>
    <p class="muted" style="font-size:.85rem">Keep a 7-day streak to earn a streak freeze (hold up to 2). A freeze automatically covers one missed day so your streak survives.</p>
  </section>`;
}

/* ---------- render ---------- */
const TABS = [["today","Today"],["hero","Hero"],["year","Year"],["areas","Areas"],["review","Review"]];
function render(){
  const y = window.scrollY;
  const open = [...main.querySelectorAll("details[open]")].map(d => d.dataset.area);
  if (!lastGame) checkGame();
  main.innerHTML = ui.tab === "hero" ? viewHero() : ui.tab === "year" ? viewYear() : ui.tab === "areas" ? viewAreas() : ui.tab === "review" ? viewReview() : viewToday();
  open.forEach(a => { const d = main.querySelector(`details[data-area="${a}"]`); if (d) d.open = true; });
  document.getElementById("tabs").innerHTML = TABS.map(([k,l]) => `<button class="${ui.tab === k ? "act" : ""}" data-tab="${k}" aria-current="${ui.tab === k ? "page" : "false"}">${ICONS[k]}<span>${l}</span></button>`).join("");
  window.scrollTo(0, y);
  if (ui.tab === "year"){ const hw = main.querySelector(".heat-wrap"), td = main.querySelector(".heat .today"); if (hw && td) hw.scrollLeft = Math.max(0, td.offsetLeft - hw.clientWidth/2); }
}

/* ---------- events ---------- */
document.getElementById("lvl").addEventListener("click", () => { ui.tab = "hero"; try { localStorage.setItem(LS+".tab", ui.tab); } catch(_) {} render(); window.scrollTo(0,0); });
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  ui.tab = b.dataset.tab; ui.confirmReset = false; ui.showImport = false;
  try { localStorage.setItem(LS+".tab", ui.tab); } catch(_) {}
  render(); window.scrollTo(0,0);
});

main.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, p = P(), s = ui.date;
  const val = id => (document.getElementById(id)?.value || "").trim();
  switch (a){
    case "habit": { const d = ensureDay(s); d.h[b.dataset.id] = !d.h[b.dataset.id]; if (!d.h[b.dataset.id]) delete d.h[b.dataset.id]; markDirty("d"+s); break; }
    case "letgo": { const d = ensureDay(s); d.letgo = Math.max(0, (Number(d.letgo)||0) + Number(b.dataset.d)); markDirty("d"+s); break; }
    case "scale": { const d = ensureDay(s); const k = b.dataset.k, v = Number(b.dataset.v); if (d[k] === v) delete d[k]; else d[k] = v; markDirty("d"+s); break; }
    case "mtask": { const m = b.dataset.m, i = b.dataset.i; p.monthTasks[m] = p.monthTasks[m] || {}; p.monthTasks[m][i] = !p.monthTasks[m][i]; markDirty("profile"); break; }
    case "date": { const dd = Number(b.dataset.d); ui.date = dd === 0 ? todayStr() : addDays(ui.date, dd); if (diffDays(todayStr(), ui.date) > 0) ui.date = todayStr(); break; }
    case "addhabit": { const v = val("add-"+b.dataset.area); if (!v) return; p.areas[b.dataset.area].habits.push({id:"h"+uid36(), label:v}); markDirty("profile"); toast("Habit added to Today"); break; }
    case "delhabit": { const ar = p.areas[b.dataset.area]; ar.habits = ar.habits.filter(h => h.id !== b.dataset.id); markDirty("profile"); break; }
    case "addbook": { const v = val("book-title"); if (!v) return; p.books.push({id:uid36(), title:v, status:"want"}); markDirty("profile"); break; }
    case "bookstatus": { const bk = p.books.find(x => x.id === b.dataset.id); if (!bk) return; bk.status = {want:"reading", reading:"done", done:"want"}[bk.status]; if (bk.status === "done"){ bk.finished = todayStr(); toast("Book finished. Nice."); } markDirty("profile"); break; }
    case "delbook": p.books = p.books.filter(x => x.id !== b.dataset.id); markDirty("profile"); break;
    case "addweight": { const v = parseFloat(val("w-val")); if (!isFinite(v)) return; p.weights = p.weights.filter(w => w.d !== todayStr()); p.weights.push({id:uid36(), d:todayStr(), v}); markDirty("profile"); toast("Weight logged"); break; }
    case "delweight": p.weights = p.weights.filter(x => x.id !== b.dataset.id); markDirty("profile"); break;
    case "addlift": { const ex = val("l-ex"), w = parseFloat(val("l-w")), r = parseInt(val("l-r"), 10); if (!ex || !isFinite(w) || !isFinite(r)) { toast("Add an exercise, weight and reps"); return; } p.lifts.push({id:uid36(), d:todayStr(), ex, w, r}); markDirty("profile"); toast("Set logged"); break; }
    case "dellift": p.lifts = p.lifts.filter(x => x.id !== b.dataset.id); markDirty("profile"); break;
    case "addincome": { const src = val("i-src") || "Income", v = parseFloat(val("i-v")); if (!isFinite(v)) { toast("Enter an amount"); return; } p.income.push({id:uid36(), d:todayStr(), src, v}); markDirty("profile"); toast("Income added"); break; }
    case "delincome": p.income = p.income.filter(x => x.id !== b.dataset.id); markDirty("profile"); break;
    case "export": {
      const txt = JSON.stringify(state); const box = document.getElementById("export-box");
      const fallback = () => { box.hidden = false; box.value = txt; box.select(); toast("Select all and copy the text"); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Backup copied"), fallback); } catch(_) { fallback(); }
      return;
    }
    case "toggleimport": ui.showImport = !ui.showImport; ui.confirmReset = false; break;
    case "import": {
      try { const s2 = JSON.parse(val("import-box")); if (!s2 || !s2.profile) throw 0;
        state = { profile: normalize(s2.profile), days: s2.days || {} };
        markDirty("profile"); Object.keys(state.days).forEach(k => dirty.add("d"+k)); ui.showImport = false; toast("Backup restored");
      } catch(_) { toast("That doesn't look like a Year One backup"); return; }
      break;
    }
    case "askreset": ui.confirmReset = true; ui.showImport = false; break;
    case "cancelreset": ui.confirmReset = false; break;
    case "reset": {
      const old = Object.keys(state.days);
      state = { profile: defaultProfile(), days: {} }; ui.confirmReset = false; ui.date = todayStr();
      markDirty("profile");
      if (col) old.forEach(k => col.doc("d"+k).delete().catch(() => {}));
      toast("Fresh start. Day one is today.");
      break;
    }
    default: return;
  }
  checkGame(e.clientX || null, e.clientY || null);
  render();
});

main.addEventListener("input", e => {
  const t = e.target, p = P(), s = ui.date;
  if (t.id === "f-sleep"){ const d = ensureDay(s); const v = parseFloat(t.value); if (isFinite(v)) d.sleep = v; else delete d.sleep; markDirty("d"+s); return; }
  if (t.id === "f-grat"){ ensureDay(s).grat = t.value; markDirty("d"+s); checkGame(); return; }
  if (t.id === "f-note"){ ensureDay(s).note = t.value; markDirty("d"+s); return; }
  const k = t.dataset.in; if (!k) return;
  if (k === "goal"){ p.areas[t.dataset.area].goal = t.value; const g = t.closest("details").querySelector(".goal-line"); g.textContent = t.value || "No goal set yet."; }
  else if (k === "rev"){ const wk = mondayOf(todayStr()); p.reviews[wk] = p.reviews[wk] || {}; p.reviews[wk][t.dataset.k] = t.value; checkGame(); }
  else if (k === "set"){ p[t.dataset.k] = t.value; }
  markDirty("profile");
});
main.addEventListener("change", e => {
  const t = e.target, p = P();
  if (t.id === "set-start" && t.value){ p.startDate = t.value; markDirty("profile"); toast("Day one set to " + fmtShort(t.value)); }
  if (t.id === "set-unit"){ p.unit = t.value; markDirty("profile"); }
});
main.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  const btn = e.target.closest(".addrow, .addrow3")?.querySelector("[data-act]");
  if (btn){ e.preventDefault(); btn.click(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); else if (ui.date !== todayStr() && ui.tab === "today") { ui.date = todayStr(); render(); } });

render();
connect();
})();
</script>
